name: Labels outils

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const section = body.match(
              /(?:^|\n)### Outils concernés\s*\n([\s\S]*?)(?=\n### |$)/i
            )?.[1] || "";

            const labelParOutil = {
              "Plug-in QGIS espace co": "espaceco_qgis",
              "Guichet web (cartes.gouv.fr)": "guichet_cartes.gouv",
              "EspaceCo mobile": "espaceco_mobile",
              "Autre plug-in qgis (indiquer l'outil dans l'onglet description)": "plugin_qgis",
              "Autre (indiquer l'outil dans l'onglet description)": "autre_outil"
            };

            const labels = [...section.matchAll(/^\s*-\s*\[x\]\s*(.+?)\s*$/gim)]
              .map(match => labelParOutil[match[1].trim()])
              .filter(Boolean);

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }
