# Déclenchement automatique du workflow, quand un élément du projet (sur lequel le workflow est activé) est modifié
on:
 
  projects_v2_item:
    types:
      - edited

jobs:

  sync-field:

    # exécution sur la machine virtuelle par défaut
    runs-on: ubuntu-latest

    steps:

      # Clone le repository dans le runner
      - name: Checkout
        uses: actions/checkout@v4

      # exécution du programme JS
      - name: Sync fields between projects
        uses: actions/github-script@v7

        with:

          # Token GitHub stocké dans les secrets pour accéder aux projets et repositories
          github-token: ${{ secrets.PROJECT_TOKEN }}

          script: |

            // ===================================================
            // 0. CONFIGURATION : définition des variables statiques 
            // (identifiants du nom des projets et des champs à impacter)
            // ===================================================

            const project2Id = 82 ;

            // Nom du champ à lire dans Projet1
            const field1Name = "fieldtestorigin";

            // Nom du champ à mettre à jour dans Projet2
            const field2Name = "fieldtest1";

            // ===================================================
            // 1. RECUPERATION DE LA MODIFICATION
            // Récupère un item GitHub Project v2 via son ID, 
            // lit ses champs personnalisés (fieldValues), 
            // extrait les valeurs de type select et les valeurs texte, 
            // récupère ensuite l’Issue liée à cet item.
            // ===================================================

            // ===== IDENTIFIER L'ITEM MODIFIÉ

            // Récupération de l’ID interne GitHub
            // de l’item du projet qui vient d’être modifié
            //
            // Cet ID est fourni automatiquement
            // par l’événement GitHub Actions.
            //
            const itemNodeId = context.payload.projects_v2_item.node_id;

            // === CHARGER LES DONNÉES DE L'ITEM

            const itemData = await github.graphql(`
              query($item: ID!) {

                node(id: $item) {

                  ... on ProjectV2Item {

                    # Liste des champs du projet
                    fieldValues(first: 20) {

                      nodes {

                        # Cas des champs "Single Select"
                        ... on ProjectV2ItemFieldSingleSelectValue {

                          # Valeur choisie
                          name

                          # Nom du champ
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                        }

                        # Cas des champs texte
                        ... on ProjectV2ItemFieldTextValue {

                          # Valeur texte
                          text

                          # Nom du champ
                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }

                    content {

                      ... on Issue {
                        id
                        number
                        title
                      }
                    }
                  }
                }
              }
            `, {
              item: itemNodeId
            });

            // ===================================================
            // 2. EXTRAIRE LES VALEURS DES CHAMPS
            // Lire la valeur du champ qui nous intéresse
            // (l’étape 1 consistait à récupérer l’entièreté du ticket qui a bougé)
            // ===================================================

            // Tableau contenant tous les champs du projet
            const fieldValues = itemData.node.fieldValues.nodes;

            // Variable qui contiendra
            // la valeur de ProjectField1
            let sourceValue = null;

            // Parcours de tous les champs
            for (const field of fieldValues) {

              // On cherche uniquement ProjectField1
              if (field.field?.name === field1Name) {

                // Selon le type du champ :
                // - Single Select => field.name
                // - Text => field.text
                //
                sourceValue =
                  field.name ||
                  field.text ||
                  null;
              }
            }

            // ===== VALIDATION

            // Si aucune valeur trouvée :
            // arrêt du workflow
            if (!sourceValue) {

              core.setFailed(
                "Aucune valeur trouvée pour ProjectField1"
              );

              return;
            }

            // ===== IDENTIFIER L'ISSUE

            // ID GitHub unique de l’issue
            //
            // Cet ID servira à retrouver
            // la même issue dans Projet2
            //
            const issueId = itemData.node.content.id;

            // ===================================================
            // 3. RECUPERATION DES INFORMATIONS POUR MAJ DU PROJET2
            // ===================================================

            // ===== CHARGER LE PROJET2 EN ENTIER

            // Objectif :
            // - récupérer tous les items du Projet2
            // - récupérer tous les champs du Projet2
            //
            const project2 = await github.graphql(`
              query($projectId: ID!) {

                node(id: $projectId) {

                  ... on ProjectV2 {

                    # Liste des items du projet
                    items(first: 100) {

                      nodes {

                        id

                        content {

                          ... on Issue {
                            id
                          }
                        }
                      }
                    }

                    # Liste des champs du projet
                    fields(first: 50) {

                      nodes {

                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `, {
              projectId: project2Id
            });

            // ===== TROUVER L'ISSUE DANS PROJET2

            // Tous les items du Projet2
            const items = project2.node.items.nodes;

            // Recherche de la même issue
            // via son ID GitHub unique
            //
            const targetItem = items.find(
              i => i.content?.id === issueId
            );

            // Si l’issue n’existe pas dans Projet2 :
            // arrêt
            if (!targetItem) {

              core.setFailed(
                "Issue absente du Projet2"
              );

              return;
            }

            // ===== TROUVER LE CHAMP CIBLE

            // Recherche du champ "ProjectField2"
            //
            const targetField =
              project2.node.fields.nodes.find(
                f => f.name === field2Name
              );

            // Si le champ n’existe pas :
            // arrêt
            if (!targetField) {

              core.setFailed(
                "Champ ProjectField2 introuvable"
              );

              return;
            }

            // ===================================================
            // 4. MISE À JOUR DU CHAMP
            // On a récupéré toutes les informations, on applique
            // ===================================================

            // Mutation GraphQL :
            // mise à jour de la valeur du champ
            //
            await github.graphql(`
              mutation(
                $project: ID!,
                $item: ID!,
                $field: ID!,
                $value: String!
              ) {

                updateProjectV2ItemFieldValue(

                  input: {

                    # Projet cible
                    projectId: $project

                    # Item du projet cible
                    itemId: $item

                    # Champ à modifier
                    fieldId: $field

                    # Nouvelle valeur
                    value: {
                      text: $value
                    }
                  }

                ) {

                  projectV2Item {
                    id
                  }
                }
              }
            `, {

              // Projet2
              project: project2Id,

              // Item à modifier
              item: targetItem.id,

              // Champ cible
              field: targetField.id,

              // Valeur provenant de Projet1
              value: sourceValue
            });

            // ===================================================
            // FIN
            // ===================================================

            console.log(
              "Synchronisation terminée"
            );
