name: Bug
description: Faire remonter un bug
assignees: [davidcallign, fvoterro, PierreDanre, thibaud-tac]

body:


  - type: markdown
    attributes:
      value: |
      
      
        Point d'entrée pour remonter des bugs sur les outils collaboratifs.
        
        Les tickets github sont publics. Les demandes de création de bases métiers et les demandes de gestion de comptes utilisateurs sont à faire sur Amélio. 

        Veuillez, si possible, indiquer le numéro du guichet plutôt que le nom du guichet.

        
  - type: checkboxes
    id: outil-concerne
    attributes:
      label: Outils concernés
      description: Cochez tous les outils concernés.
      options:
        - label: Plug-in QGIS espace co
        - label: Guichet web (cartes.gouv.fr)
        - label: EspaceCo mobile
        - label: Autre plug-in qgis (indiquer l'outil dans l'onglet description)
        - label: Autre (indiquer l'outil dans l'onglet description)

  - type: dropdown
    id: bloquant
    attributes:
      label: Bloquant
      options:
        - Non Bloquant
        - Légèrement Bloquant
        - Bloquant
        - Très Bloquant
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
        label: Description
        description: |
              Ajoutez des copies d'écran si cela peut aider à expliquer le problème.
    validations:
        required: true

  - type: textarea
    id: expected-behaviour
    attributes:
        label: Comportement attendu
    validations:
        required: true
  
  - type: textarea
    id: how-to-reproduce
    attributes:
        label: Comment reproduire l'anomalie
        description: |
            Dans quelles conditions se produit l'anomalie : sur un ordinateur de bureau ou sur mobile ? Avec quel système d'exploitation ? Quel navigateur et version ?
            Etapes pour reproduire le comportement :
            1. Se rendre sur ...
            2. Cliquer sur ...
            3. Scroller jusqu'à ...
            4. Constater l'erreur ...

            Ajoutez des copies d'écran si nécessaire.
    validations:
        required: false


