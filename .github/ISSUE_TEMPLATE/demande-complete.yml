name: Demande complète
description: Transmettre une demande
assignees: [davidcallign, fvoterro, PierreDanre, thibaud-tac]

body:
  - type: markdown
    attributes:
      value: |
      
        Point d'entrée pour toute demande d'amélioration des outils collaboratifs et remontées de bugs.
        
        Les demandes de configuration de base de données espace-collaboratif sont à faire via Amélio. 
        De même pour les demandes de droits des utilisateurs. 

        Veuillez, si possible, indiquer le numéro du guichet plutôt que le nom du guichet.
        
  - type: checkboxes
    id: outil-concerne
    attributes:
      label: Outils concernés
      description: Cochez tous les outils concernés.
      options:
        - label: Plug-in QGIS espace co
        - label: Guichet web (cartes.gouv.fr)
        - label: Autre ou plusieurs outils

  - type: textarea
      id: description
      attributes:
          label: Description
          description: |
              Ajoutez des copies d'écran si cela peut aider à expliquer le problème.
      validations:
          required: true

  - type: textarea
      id: expected-behaviour
      attributes:
          label: Comportement attendu
      validations:
          required: true
  
  - type: textarea
      id: how-to-reproduce
      attributes:
          label: Comment reproduire l'anomalie
          description: |
              Dans quelles conditions se produit l'anomalie : sur un ordinateur de bureau ou sur mobile ? Avec quel système d'exploitation ? Quel navigateur et version ?
              Etapes pour reproduire le comportement :
              1. Se rendre sur ...
              2. Cliquer sur ...
              3. Scroller jusqu'à ...
              4. Constater l'erreur ...

              Ajoutez des copies d'écran si nécessaire.
      validations:
          required: false
  
  - type: dropdown
    id: type-demande
    attributes:
      label: Type de demande
      description: Choisissez la catégorie qui correspond le mieux.
      options:
        - Bug
        - Amélioration
        - Nouvelle fonctionnalité
        - Question ou aide
        - Autre
    validations:
      required: true

  - type: input
    id: resume
    attributes:
      label: Résumé
      description: Décrivez brièvement votre demande.
      placeholder: "Ex. : Impossible d’enregistrer une carte"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description détaillée
      description: Décrivez le problème ou le besoin.
      placeholder: Indiquez le contexte et les détails utiles.
      render: text
    validations:
      required: true

  - type: dropdown
    id: urgence
    attributes:
      label: Urgence
      options:
        - Faible
        - Normale
        - Élevée
        - Bloquante
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire (pour un bug)
      description: Décrivez les étapes à suivre pour reproduire le problème.
      placeholder: |
        1. ...
        2. ...
        3. ...
      render: text

  - type: textarea
    id: resultat-attendu
    attributes:
      label: Résultat attendu
      description: Que devriez-vous obtenir ou pouvoir faire ?
      render: text

  - type: textarea
    id: resultat-observe
    attributes:
      label: Résultat observé
      description: Que se passe-t-il actuellement ?
      render: text

  - type: input
    id: environnement
    attributes:
      label: Environnement
      description: Précisez votre navigateur, système, version de QGIS ou autre information pertinente.
      placeholder: "Ex. : Firefox 130, Windows 11, QGIS 3.x"

  - type: textarea
    id: complements
    attributes:
      label: Informations complémentaires
      description: Ajoutez des liens ou toute autre information utile.
      render: text
